<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .drapeau {
            text-align: center;
        }
    </style>

    <script>
        let data = {
            polluant: "CO2",
            unite: "milliards de tonnes",
            annee: 2017,
            pays: [
                { nom: "Chine", valeur: 9.26, pourcentage: 28.2, code: "cn" },
                { nom: "Etats-Unis", valeur: 4.76, pourcentage: 14.5, code: "us" },
                { nom: "Inde", valeur: 2.16, pourcentage: 6.6, code: "in" },
                { nom: "Russie", valeur: 1.54, pourcentage: 4.7, code: "ru" },
                { nom: "Japon", valeur: 1.13, pourcentage: 3.4, code: "jp" },
                { nom: "Allemagne", valeur: 0.72, pourcentage: 2.2, code: "de" },
                { nom: "Corée du Sud", valeur: 0.6, pourcentage: 1.8, code: "kr" },
                { nom: "Iran", valeur: 0.57, pourcentage: 1.7, code: "ir" },
                { nom: "Canada", valeur: 0.55, pourcentage: 1.7, code: "ca" },
            ],
        };

        function initialiserDonnees() {
            document.querySelector("#titre").textContent = `Pays les plus polluants pour le ${data.polluant} (${data.unite}) en ${data.annee}`;
            document.querySelector("#annee").textContent = data.annee;

            for (let i = 0; i < data.pays.length; i++) {
                document.querySelector("#corps").innerHTML += `<tr>
                    <td class="drapeau"><img src="https://flagcdn.com/24x18/${data.pays[i].code}.png"></td>
                    <td>${data.pays[i].nom}</td>
                    <td>${data.pays[i].valeur}</td>
                    <td>${data.pays[i].pourcentage}</td>
                </tr>`;
            }
        }
    </script>
</head>

<body onload="initialiserDonnees()">
    <h1 id="titre"></h1>
    <h2 id="annee"></h2>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>Nom</th>
                <th>Valeur</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="corps">

        </tbody>
    </table>

</body>

</html>
